name: Multi-architecture Build Status

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.github/workflows/update-dockerhub-description-readme.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to develop)'
        required: false
        default: 'develop'

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: |
          v=$(sed -n "/VERSION/ s/.*'\([0-9.]*\)'.*/\1/p" lib/Infinitude.pm)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: nebulous/infinitude
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.ver.outputs.version }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ steps.buildx.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Tag and release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            git tag "$v"
            git push origin "$v"
          fi
          # Before CalVer adoption this repo had no tags, so the first
          # generated release would cover the entire history. Anchor the
          # notes at the pre-push master head instead.
          if ! git ls-remote --exit-code --tags origin baseline >/dev/null 2>&1; then
            git tag baseline "${{ github.event.before }}"
            git push origin baseline || true
          fi
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          prev=${prev:-baseline}
          gh release create "$v" --generate-notes --notes-start-tag "$prev" --title "Infinitude $v" 2>/dev/null || true
